<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>治愈系 · 萌宠心语</title>
    <style>
        :root {
            --warm-gold: #fdf5e6;
            --soft-red: #ff6b6b;
            --text-color: #5d5d5d;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #fff5f5 0%, #fff0e6 100%);
            font-family: "Microsoft YaHei", sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 顶部标题 */
        header {
            margin-top: 40px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #444;
        }

        /* 核心爱心区域 */
        .stage {
            position: relative;
            margin: 60px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart {
            position: relative;
            width: 260px;
            height: 260px;
            background-color: var(--soft-red);
            transform: rotate(-45deg);
            animation: heartBeat 1.5s infinite;
            cursor: pointer;
            box-shadow: 0 15px 45px rgba(255, 107, 107, 0.4);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            background-color: var(--soft-red);
            border-radius: 50%;
        }

        .heart::before { top: -130px; left: 0; }
        .heart::after { left: 130px; top: 0; }

        #pet-img {
            position: absolute;
            width: 140%;
            height: 140%;
            object-fit: cover;
            transform: rotate(45deg);
            transition: opacity 0.4s;
            z-index: 5;
        }

        @keyframes heartBeat {
            0% { transform: rotate(-45deg) scale(0.9); }
            15% { transform: rotate(-45deg) scale(1.05); }
            30% { transform: rotate(-45deg) scale(0.95); }
            45% { transform: rotate(-45deg) scale(1.1); }
            70% { transform: rotate(-45deg) scale(0.9); }
            100% { transform: rotate(-45deg) scale(0.9); }
        }

        /* 文案滚动区 */
        .script-box {
            max-width: 600px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            line-height: 1.8;
            font-size: 1.05rem;
            margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: justify;
        }

        /* 漂浮装饰 */
        .floating {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
            animation: floatAni 6s infinite ease-in-out;
        }

        @keyframes floatAni {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }
    </style>
</head>
<body>

<header>
    <h1>生命·治愈·重生</h1>
    <p>点击爱心 遇见温暖</p>
</header>

<div class="stage">
    <div class="heart" onclick="changeImage()">
        <img id="pet-img" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500" alt="Pet">
    </div>
</div>

<div class="script-box">
    你发现了吗？那些真正经历过低谷的人，性格全变了。不再幻想，不再言语，他们在孤独中重组了灵魂。这就是“特修斯之船”的代价。人生本质是孤独的，唯有心是真的。心随境转则烦，境随心转则悦。往后余生，愿你在沉默中强大，在孤独中重生。
</div>

<div class="floating" style="top: 20%; left: 5%; font-size: 40px;">🐱</div>
<div class="floating" style="top: 50%; right: 10%; font-size: 35px; animation-delay: 1s;">🐶</div>
<div class="floating" style="bottom: 10%; left: 15%; font-size: 30px; animation-delay: 2s;">🐾</div>
<div class="floating" style="top: 10%; right: 20%; font-size: 25px; animation-delay: 3s;">🦴</div>

<script>
    const images = [
        "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500",
        "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=500",
        "https://images.unsplash.com/photo-1517849845537-4d257902454a?w=500",
        "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=500",
        "https://images.unsplash.com/photo-1472491235688-bdc81a63246e?w=500"
    ];
    let idx = 0;
    function changeImage() {
        const img = document.getElementById('pet-img');
        img.style.opacity = '0';
        setTimeout(() => {
            idx = (idx + 1) % images.length;
            img.src = images[idx];
            img.style.opacity = '1';
        }, 400);
    }
</script>

</body>
</html>
